services:
  mysql:
    image: mysql:8.4
    container_name: shop-api-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: shop_password
      MYSQL_DATABASE: shop_db
    ports:
      - "3307:3306"
    volumes:
      - shop_api_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pshop_password"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    container_name: shop-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: shop_db
      DB_USER: root
      DB_PASS: shop_password
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads

volumes:
  shop_api_mysql_data:
